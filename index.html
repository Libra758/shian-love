<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拾安 · 诗宁的小角落</title>
<style>
  /* 内联根基样式，确保文字永远横排 */
  *{writing-mode:horizontal-tb!important;text-orientation:mixed!important;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-heart"></div>

  <header>
    <div class="time-box">
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date">——</div>
    </div>
    <div class="title">拾安 & 诗宁</div>
  </header>

  <main>
    <section class="chat-window">
      <div class="chat-scroll" id="chatScroll">
        <div class="msg left">
          <div class="avatar">拾</div>
          <div class="bubble">诗宁，你来啦。</div>
        </div>
        <div class="msg right">
          <div class="bubble">嗯，我来啦。</div>
          <div class="avatar">宁</div>
        </div>
      </div>
      <div class="chat-input">
        <input id="chatText" type="text" placeholder="跟拾安说句话…" maxlength="50">
        <button id="chatSend">发送</button>
      </div>
    </section>

    <section class="interact">
      <button class="interact-btn" data-act="pat">摸摸头</button>
      <button class="interact-btn" data-act="hug">要抱抱</button>
      <button class="interact-btn" data-act="heart">比心</button>
      <button class="interact-btn" data-act="miss">想你了</button>
    </section>

    <div id="feedback" class="feedback">点我，或者跟我说说话。</div>

    <section class="games">
      <h2 class="games-title">一起玩 ~</h2>
      <div class="game-nav">
        <button class="game-tab active" data-game="snake">贪吃心心</button>
        <button class="game-tab" data-game="bubble">戳泡泡</button>
        <button class="game-tab" data-game="catch">接住心心</button>
        <button class="game-tab" data-game="flip">翻牌配对</button>
      </div>

      <div class="game-panel active" id="panel-snake">
        <div class="game-score">分数：<span id="snakeScore">0</span></div>
        <canvas id="snakeCanvas" width="320" height="320"></canvas>
        <p class="game-hint">上下左右滑动，吃心心长大</p>
        <button class="game-start" id="snakeStart">开始 / 重来</button>
      </div>

      <div class="game-panel" id="panel-bubble">
        <div class="game-score">戳破：<span id="bubbleScore">0</span></div>
        <div class="bubble-field" id="bubbleField"></div>
        <button class="game-start" id="bubbleStart">重新开始</button>
      </div>

      <div class="game-panel" id="panel-catch">
        <div class="game-score">接到：<span id="catchScore">0</span></div>
        <canvas id="catchCanvas" width="320" height="360"></canvas>
        <p class="game-hint">左右滑动移动篮子，接住心心</p>
        <button class="game-start" id="catchStart">开始 / 重来</button>
      </div>

      <div class="game-panel" id="panel-flip">
        <div class="game-score">步数：<span id="flipScore">0</span></div>
        <div class="flip-grid" id="flipGrid"></div>
        <button class="game-start" id="flipStart">重新开始</button>
      </div>
    </section>

    <section class="breathe">
      <div class="breathe-circle" id="breatheCircle">
        <span id="breatheText">呼气</span>
      </div>
      <p class="breathe-hint">跟着它一起，慢慢呼吸</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
